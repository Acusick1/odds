base: xgboost_epl_retail_ev.yaml
experiment:
  name: xgboost_epl_retail_ev_price_only
  tags:
  - xgboost
  - epl
  - retail_ev
  - tuning
  description: 'First price-only run on the ADR-0012 retail-EV target (#540): the
    retail_ev config to 2026-07-31, leaving 2026-27 untouched as the candidate fresh
    season. Scoring folds start at the first 2025-26 event (min_train_events is the
    2024-25 event count); the 68-event step splits the 340 scored 2025-26 events into
    five folds with no partial block, so the last fold holds every live-collected
    event of April and May 2026. The search space is scaled to the mean-one loss
    weights. Tuning runs on 2024-25 only (experiments/scripts/retail_ev_price_only.py).
    Development data; no keep-bar claim.'
training:
  data:
    min_train_events: 380
    val_step_events: 68
  model:
    n_jobs: 1
tuning:
  n_trials: 50
  metric: val_mse
  pruner: none
  sampler: tpe
  search_spaces:
    n_estimators:
      type: int
      low: 100
      high: 600
      step: 50
    max_depth:
      type: int
      low: 2
      high: 5
    learning_rate:
      type: float
      low: 0.01
      high: 0.1
      log: true
    min_child_weight:
      type: int
      low: 20
      high: 2000
      log: true
    subsample:
      type: float
      low: 0.5
      high: 1.0
      step: 0.1
    colsample_bytree:
      type: float
      low: 0.5
      high: 1.0
      step: 0.1
    reg_lambda:
      type: float
      low: 0.01
      high: 10.0
      log: true
