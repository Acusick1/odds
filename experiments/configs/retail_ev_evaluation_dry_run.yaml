# Dry run of the one-look evaluation on development data, shaped as ADR-0016 drafts it:
# 50-event expanding refits with the 7-day gap, the frozen 2024-25 residual seed-42 trial,
# 10,000 event-clustered resamples with seed 0. The window holds the live-collected
# events of March to May 2026. No event after 2026-07-31 is read; this is not a keep-bar
# result.
training_start: 2024-08-01T00:00:00Z
window:
  start: 2026-02-01T00:00:00Z
  end: 2026-07-31T23:59:59Z
refit_every_events: 50
feature_groups: []
arm: residual
model:
  n_jobs: 1
trial:
  path: ../results/retail_ev_as_of_t_groups/summary.json
  variant: price_only
  run: residual_s42
seed: 42
bootstrap:
  resamples: 10000
  seed: 0
