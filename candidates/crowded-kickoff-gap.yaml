name: crowded-kickoff-gap
description: When at least 6 matches of the six football leagues, the match included, kick off within 10 minutes of the match, back the longest UK retail price when the Betfair Exchange fair probability times the price minus 1 exceeds 1%, 60 and 30 minutes before kick-off, one outcome per decision and at most once per outcome
