[project]
name = "odds-lambda"
version = "0.1.0"
description = "Lambda runtime code for betting odds pipeline"
authors = [{name = "Andrew"}]
requires-python = ">=3.12"
dependencies = [
    "odds-core",
    "aiohttp>=3.9.0",
    "apscheduler==4.0.0a6",
    "tenacity>=8.2.3",
    "boto3>=1.34.0",
    "nbainjuries>=1.1.1",
    "playwright>=1.58.0",
    "requests>=2.31.0",
    "betfairlightweight>=2.23.2",
    "cryptography>=46.0.3",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
    "sqlalchemy>=2.0.44",
    "sqlmodel>=0.0.27",
    "pydantic>=2.12.4",
    "rich>=14.2.0",
]

[tool.uv.sources]
odds-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odds_lambda"]

[tool.deptry.per_rule_ignores]
DEP003 = ["botocore"]
