[project]
name = "odds-web"
version = "0.1.0"
description = "Read-only web UI over the candidates' forward tests"
authors = [{name = "Andrew"}]
requires-python = ">=3.12"
dependencies = [
    "odds-core",
    "odds-analytics",
    "odds-lambda",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.44",
    "asyncpg>=0.30.0",
    "structlog>=25.5.0",
]

[tool.uv.sources]
odds-core = { workspace = true }
odds-analytics = { workspace = true }
odds-lambda = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["odds_web"]
