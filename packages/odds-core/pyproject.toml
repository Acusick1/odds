[project]
name = "odds-core"
version = "0.1.0"
description = "Core foundation layer for betting odds pipeline"
authors = [{name = "Andrew"}]
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.14",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.1.0",
    "structlog>=23.3.0",
    "aiohttp>=3.9.0",
    "sqlalchemy>=2.0.44",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odds_core"]

[tool.deptry.per_rule_ignores]
DEP002 = ["asyncpg"]
