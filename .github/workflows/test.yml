name: Test

on:
  push:
    branches-ignore: [main]
    # The wiki and docs are checked by Lint; they can't change a test result.
    paths-ignore:
      - 'wiki/**'
      - 'docs/**'
      - '**/*.md'
  workflow_call:
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # uv selects the interpreter from requires-python in pyproject.toml.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync

      - name: Check declared dependencies
        run: |
          for pkg in packages/*/; do
            (cd "$pkg" && uv run --project ../.. --with deptry deptry .)
          done

      - name: Run unit and integration tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run pytest -v

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
            *.txt
