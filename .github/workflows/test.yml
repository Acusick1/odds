name: Test

on:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress. The event is in the group
# so a manual ci-cd.yml run cannot cancel the push run, the only one a ruleset counts.
concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The test check is required on main, so a branch that touches only docs must report it as
  # skipped (which passes) rather than never run it. The whole branch is compared with main so
  # a docs-only push after a code change still runs the tests; renames count as a deletion and
  # an addition so moving the how-to page still runs them.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lint checks the wiki and docs. The how-to page counts as code because
      # tests/unit/test_candidates.py validates its example draft.
      - name: Compare with main
        id: diff
        run: |
          changed="$(git diff --no-renames --name-only origin/main...HEAD)"
          code="$(printf '%s\n' "$changed" | grep -v -E '^(wiki|docs)/|\.md$' || true)"
          if [[ -n "$code" ]] || grep -qx 'wiki/evaluation/howto-take-an-idea-to-a-verdict.md' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Unit and Integration Tests
    needs: changes
    # A failed detection runs the tests: a job skipped by a failed dependency would pass the
    # required check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || github.event_name != 'push') }}
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # uv selects the interpreter from requires-python in pyproject.toml.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync

      - name: Check declared dependencies
        run: |
          for pkg in packages/*/; do
            (cd "$pkg" && uv run --project ../.. --with deptry deptry .)
          done

      - name: Run unit and integration tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run pytest -v

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
            *.txt
