name: Lint

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # wiki-lint staleness reads git history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # Only uvx pre-commit runs here; the cache key tracks project dependency files this job never installs.
          enable-cache: false

      - name: Run all hooks on all files
        run: uvx pre-commit run --all-files --show-diff-on-failure
