name: CI/CD Pipeline

# Manual only: pull requests pass Test before merge, and its dev deploy targets the
# dormant AWS stack.
on:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy-dev:
    name: Deploy to Dev
    needs: test
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
