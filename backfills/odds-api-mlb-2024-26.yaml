# Odds API historical backfill of MLB 2024, 2025 and 2026 (#785, map #774). Never edit once frozen; a
# top-up is a new manifest. Granularity and billing are unconfirmed until the day-1 probe.
sport: baseball_mlb
# Calendar-year windows: the regular season, post-season and the 2026 All-Star Game (see the PR) fall inside each.
seasons:
  "2024": {start: 2024-01-01T00:00:00Z, end: 2024-11-15T00:00:00Z}
  "2025": {start: 2025-01-01T00:00:00Z, end: 2025-11-15T00:00:00Z}
  "2026": {start: 2026-01-01T00:00:00Z, end: 2026-11-15T00:00:00Z}
markets: [h2h, totals]
bookmakers:
  - pinnacle
  - betfair_ex_uk
  - williamhill
  - paddypower
  - skybet
  - ladbrokes_uk
  - coral
  - betfred_uk
  - betvictor
  - sport888
# A decision at any whole minute in a band finds a snapshot at most its max age old.
# Chosen in #740.
coverage:
  - {min_lead_minutes: 1, max_lead_minutes: 120, max_input_age_minutes: 10}
  - {min_lead_minutes: 121, max_lead_minutes: 1440, max_input_age_minutes: 60}
  - {min_lead_minutes: 1441, max_lead_minutes: 10080, max_input_age_minutes: 360}
# 5-minute snapshots throughout, since the Odds API moved from 10 minutes on 2022-09-01.
snapshot_grid:
  - {start: 2022-09-01T00:00:00Z, step_minutes: 5}
probe:
  snapshots:
    - 2024-07-20T16:00:00Z
    - 2026-07-18T16:00:00Z
  # Call sharing needs fixtures as far ahead as the earliest coverage, 7 d plus its 6 h max age.
  min_fixture_lead_hours: 174
  # MLB's close is out of scope (#774), so only the sharp reference is required.
  required_bookmakers:
    h2h: [pinnacle]
    totals: [pinnacle]
  units_per_call: 20
