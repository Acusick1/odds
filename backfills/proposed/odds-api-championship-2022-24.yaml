# Odds API historical backfill of the Championship from April 2023 to the end of 2023-24
# (#859 step 10). A top-up of odds-api-championship-2024-26.yaml; it shares no fixture with it.
# Snapshot grid, billing, books and fixture horizon follow the probe (#729, #787).
sport: soccer_efl_champ
# 2022-23 starts 1 April 2023, the first date the probes found the exchange on EPL h2h (#729);
# the probe checks it for this league.
# League seasons only: the stored fixtures exclude the play-offs (#789).
seasons:
  2022-23: {start: 2023-04-01T00:00:00Z, end: 2023-07-01T00:00:00Z}
  2023-24: {start: 2023-07-01T00:00:00Z, end: 2024-07-01T00:00:00Z}
# Totals are not requested: the exchange quotes none in any probed sport or season (#787).
markets: [h2h]
# The uk region bills as one region, 10 units per call, and returns 11 to 20 UK books per
# sport, Pinnacle not among them (wiki/collection/odds-api-facts.md#coverage).
regions: [uk]
# A decision at any whole minute in a band finds a snapshot at most its max age old.
# The bands of the 2024-26 manifest, chosen in #740, the far band ending at 4 d since the API
# lists Championship fixtures only 125-172 h ahead (#787).
coverage:
  - {min_lead_minutes: 1, max_lead_minutes: 120, max_input_age_minutes: 10}
  - {min_lead_minutes: 121, max_lead_minutes: 1440, max_input_age_minutes: 60}
  - {min_lead_minutes: 1441, max_lead_minutes: 5760, max_input_age_minutes: 360}
# 5-minute snapshots, each about 38 s past its 5-minute mark (probed in #729).
snapshot_grid:
  - {start: 2022-09-01T00:00:38Z, step_minutes: 5}
probe:
  snapshots:
    - 2023-04-01T09:55:38Z
    - 2023-09-16T09:55:38Z
  # Call sharing needs fixtures as far ahead as the earliest coverage, 4 d plus its 6 h max age.
  min_fixture_lead_hours: 102
  # Betfair Exchange is the scoring reference and close (ADR-0012); no current candidate or
  # model uses Pinnacle.
  required_bookmakers:
    h2h: [betfair_ex_uk]
